<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Agent Hub 产品指南</title></head>
<body>
  <h1>Agent Hub 产品指南</h1>
  <p>Agent Hub 是星河科技面向企业的智能体协作平台，支持知识库检索与工具编排。</p>
  <h2>核心能力</h2>
  <ul>
    <li>知识库向量检索（PostgreSQL + pgvector）</li>
    <li>可选知识图谱（Neo4j）</li>
    <li>多格式文档解析：PDF、Word、Excel、PPT、HTML、CSV、JSON</li>
  </ul>
  <h2>安装步骤</h2>
  <ol>
    <li>部署后端服务 agent-service</li>
    <li>配置嵌入模型与数据源</li>
    <li>在管理台创建知识库并上传文档</li>
  </ol>
  <h2>版本说明</h2>
  <p>标准版支持 10 个知识库；企业版不限知识库数量并开放图谱抽取。</p>
